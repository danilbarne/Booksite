<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <h1 class="logo"><a href="{{ url_for('home') }}" style="text-decoration: none; color: inherit;">Моя книга</a></h1>
        <button id="themeButton" class="theme-button">🌙</button>
    </header>

    <main style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <div class="auth-container">
            <h2>Новый пароль</h2>
            <form method="POST">
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Подтверждение пароля</label>
                    <input type="password" name="password_confirm" required>
                </div>
                <button type="submit" class="button">Изменить пароль</button>
            </form>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
